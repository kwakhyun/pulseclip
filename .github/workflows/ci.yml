name: Quality checks

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  desktop-app:
    name: Desktop app
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Verify desktop app
        run: npm run verify
      - name: Verify Windows package
        run: npx electron-builder --dir --x64
      - name: Verify Electron security fuses
        run: npm run verify:fuses
      - name: Audit production dependencies
        run: npm audit --omit=dev --audit-level=high

  landing-page:
    name: Landing page
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: landing
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: landing/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Build landing page
        run: npm run build
      - name: Test hosting bundle
        run: npm run test:sites
      - name: Audit production dependencies
        run: npm audit --omit=dev --audit-level=high
